      let audioCtx = null, masterGain = null, soundOn = true, musicOn = false, musicTimer = null, musicBus = null, lastTick = 0;
      function ensureAudio() {
        try {

            if (!Ctx) return null;
            audioCtx = new Ctx();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.9;
            masterGain.connect(audioCtx.destination);
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
          return audioCtx;
        } catch { return null; }
      }
      function playTone(freq, t, dur, opts = {}) {
        if (!audioCtx || !masterGain) return;
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = opts.type ?? "sine";
        osc.frequency.setValueAtTime(freq, t);
        if (opts.to) osc.frequency.exponentialRampToValueAtTime(opts.to, t + dur);
        const vol = opts.vol ?? 0.08, atk = opts.attack ?? 0.01;
        g.gain.setValueAtTime(1e-4, t);
        g.gain.exponentialRampToValueAtTime(vol, t + atk);
        g.gain.exponentialRampToValueAtTime(1e-4, t + dur);
        osc.connect(g).connect(opts.dest ?? masterGain);
        osc.start(t); osc.stop(t + dur + 0.05);
      }
      const CHORDS = [[261.63, 329.63, 392], [220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66]];
      function startMusic() {
        const ctx = ensureAudio();
        if (!ctx || !masterGain || musicTimer !== null) return;
        musicBus = ctx.createGain(); musicBus.gain.value = 1e-4;
        const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
        musicBus.connect(lp).connect(masterGain);
        musicBus.gain.exponentialRampToValueAtTime(0.5, ctx.currentTime + 1.5);
        let step = 0;
        const tick = () => {
          if (!audioCtx || !musicBus) return;
          const now = audioCtx.currentTime + 0.05, ch = CHORDS[step % CHORDS.length];
          ch.forEach(f => playTone(f, now, 4.2, { vol: 0.022, attack: 1.2, dest: musicBus }));
          playTone(ch[step * 2 % 3] * 2, now + 1, 1.6, { type: "triangle", vol: 0.012, attack: 0.3, dest: musicBus });
          step++;
        };
        tick(); musicTimer = window.setInterval(tick, 4000);
      }
      function stopMusic() {
        if (musicTimer !== null) { clearInterval(musicTimer); musicTimer = null; }
        if (audioCtx && musicBus) {
          const b = musicBus;
          b.gain.exponentialRampToValueAtTime(1e-4, audioCtx.currentTime + 0.6);
          setTimeout(() => b.disconnect(), 800);
        }
        musicBus = null;

      function sfx(name, opts = {}) {
        if (!soundOn) return;
        const ctx = ensureAudio();
        if (!ctx || !masterGain) return;
        const t = ctx.currentTime + 0.01;
        if (name === "tap") playTone(880, t, 0.06, { type: "triangle", vol: 0.035 });
        else if (name === "page") playTone(520, t, 0.09, { type: "triangle", vol: 0.04, to: 700 });
        else if (name === "tick") { const n = performance.now(); if (n - lastTick < 45) return; lastTick = n; playTone(1500, t, 0.03, { type: "square", vol: 0.018 }); }

          osc.connect(lp).connect(g).connect(masterGain); osc.start(t); osc.stop(t + dur + 0.05);

        OFF_TO_PATIENT: { label: "ปิดทางผู้ป่วย (สำหรับ zero)", detail: "ปิดทางผู้ป่วย · transducer เปิดสู่อากาศเพื่อ zero", links: [["transducer", "air"]], closed: ["patient", "drain"], csfCanDrain: false, icpReadable: false }

      const mem = new Map(), memStore = { getItem: k => mem.get(k) ?? null, setItem: (k, v) => void mem.set(k, v), removeItem: k => void mem.delete(k) };
      function storage() { try { if (typeof localStorage !== "undefined") { localStorage.getItem("_"); return localStorage; } } catch {} return memStore; }

      function TeacherPage({ go }) {

          return [hdr.map(esc).join(","), ...lines].join("\n");
        }, [rows]);
        const avg = rows.length ? (rows.reduce((s, r) => s + totalStarsOf(r), 0) / rows.length).toFixed(1) : "0.0";
        const full4 = rows.filter(r => CORE_M.every(k => r.m[k])).length;
        return h("div", { className: "page wide" },
          h("h2", null, "ตรวจผลนิสิต (สำหรับผู้สอน)"),
          h("p", { className: "muted" }, "วางรหัส EVD1… ที่นิสิตส่งมาในกล่องด้านล่าง (วางทีละหลายรหัสหรือวางทั้งหน้าส่งงานได้)"),
          h("textarea", { className: "code-in", rows: 5, value: raw, onChange: e => setRaw(e.target.value), placeholder: "วางรหัส EVD1.… ที่นี่" }),
          h("div", { className: "row" }, h("button", { className: "btn ghost", onClick: () => setRaw("") }, "ล้างกล่อง"), h("button", { className: "btn ghost", onClick: () => go("home") }, "หน้าหลัก")),
          (rows.length > 0 || bad.length > 0) && h(Fragment, null,
            h("div", { className: "t-stats" },
              h("div", null, h("b", null, rows.length), h("span", null, "นิสิต")),
              h("div", null, h("b", null, avg), h("span", null, "ดาวเฉลี่ย / 18")),
              h("div", null, h("b", null, full4), h("span", null, "ผ่านภารกิจ 1–4 ครบ")),
              h("div", null, h("b", null, bad.length), h("span", null, "รหัสใช้ไม่ได้"))
            ),
            dupes > 0 && h("p", { className: "muted small" }, "พบรหัสซ้ำ ", dupes, " รายการ แสดงเฉพาะรหัสล่าสุด"),
            h("div", { className: "table-scroll" },
              h("table", { className: "map-table t-table" },
                h("thead", null, h("tr", null, h("th", null, "รหัสนิสิต"), h("th", null, "ชื่อ"), h("th", null, "กลุ่ม"), ALL_M.map(k => h("th", { key: k }, k)), h("th", null, "รวม"), h("th", null, "จุดที่ควรฝึก"))),
                h("tbody", null, rows.map(r => h("tr", { key: r.s + r.n },
                  h("td", null, r.s), h("td", null, r.n), h("td", null, r.g),
                  ALL_M.map(k => h("td", { key: k, className: "c" }, r.m[k] ? h(Stars, { n: r.m[k][0], size: 13 }) : "–")),
                  h("td", { className: "c" }, h("b", null, totalStarsOf(r))),
                  h("td", { className: "small" }, Object.values(r.x).flat().map(tagLabel).join(" · ") || "–")

              h("button", { className: "btn", onClick: async () => { try { await navigator.clipboard.writeText(csv); setCsvMsg("คัดลอก CSV แล้ว"); } catch { csvRef.current?.select(); setCsvMsg("กด Ctrl+C เพื่อคัดลอก"); } } }, "คัดลอกเป็น CSV"),
              csvMsg && h("span", { className: "muted" }, csvMsg)

            h("textarea", { ref: csvRef, className: "code-out", readOnly: true, rows: 4, value: csv })

      }

      function SummaryPage({ prog, go, setStudent }) {
        const sum = MISSIONS_META.reduce((s, m) => s + (prog.missions[m.id]?.stars ?? 0), 0);
        const tags = MISSIONS_META.flatMap(m => (prog.missions[m.id]?.mistakeTags ?? []).map(t => ({ m, t })));
        const rec = useCase().mission4.recordFields;
        return h("div", { className: "page" },
          h("h2", null, "สรุปผลการฝึก"),
          h("div", { className: "sum-top" }, h("div", { className: "sum-stars" }, h("b", null, sum), h("span", null, "/ ", MISSIONS_META.length * 3, " ดาว")), h("p", { className: "muted" }, "ดาวเป็นผลการฝึกในเกม ไม่ใช่การรับรองสมรรถนะปฏิบัติจริง")),
          h("h3", null, "ทักษะ"),
          h("ul", { className: "skills" }, MISSIONS_META.map(m => {
            const it = prog.missions[m.id];
            return h("li", { key: m.id }, h("span", { className: it ? "ok" : "todo" }, it ? "✓" : "○"), h("span", { className: "grow" }, m.skill), h(Stars, { n: it?.stars ?? 0, size: 16 }), h("button", { className: "btn sm", onClick: () => go(m.id), disabled: m.id === "icp" && !coreDone(prog) }, "เล่นซ้ำ"));
          })),
          h("h3", null, "จุดที่ควรฝึกซ้ำ"),
          tags.length === 0 ? h("p", { className: "muted" }, coreDone(prog) ? "ยังไม่พบจุดผิดในรอบล่าสุด" : "เล่นให้ครบ 4 ภารกิจเพื่อดูจุดที่ควรฝึก") : h("ul", { className: "practice" }, tags.map(({ m, t }) => h("li", { key: m.id + t }, tagLabel(t), " ", h("button", { className: "link", onClick: () => go(m.id) }, "ฝึก", m.short)))),
          h(CodeBox, { prog, setStudent }),
          h("h3", null, "บันทึกตัวอย่างที่ถูกต้อง"),
          h("table", { className: "rec-table" }, h("tbody", null, rec.map(f => h("tr", { key: f.id }, h("th", null, f.label), h("td", null, f.options[f.answer]))))),
          h("div", { className: "row", style: { marginTop: 14 } }, h("button", { className: "btn primary", onClick: () => go("home") }, "หน้าหลัก"), h("button", { className: "btn", onClick: () => go("teacher") }, "ตรวจผล (ผู้สอน)"))
        );
      }

      function HomePage({ prog, go, onStart, onClear, setLearning, setCase, randomCase }) {
        const c = useCase(), unlocked = coreDone(prog);
        const [confirmClr, setConfirmClr] = useState(false);
        return h("div", { className: "home" },
          h("section", { className: "hero" },
            h("h1", null, "EVD Level Up"),
            h("p", { className: "sub" }, "จัดระดับให้ตรง ดูแลให้ปลอดภัย"),
            h("div", { className: "flow big" }, ["เห็นจุด", "จัดศูนย์", "ตั้งตามคำสั่ง", "อ่านค่า", "บันทึก"].map(s => h("span", { key: s, className: "flow-step on" }, s))),
            h("div", { className: "row center" },
              h("button", { className: "btn primary lg", onClick: onStart }, prog.tutorialDone ? "เล่นต่อ" : "เริ่มเล่น (Tutorial 1 นาที)"),
              h("button", { className: "btn", onClick: () => go("tutorial") }, "ดู Tutorial")
            ),
            h("p", { className: "muted small" }, "ฝึกดูแลผู้ป่วยผู้ใหญ่หลังผ่าตัดกะโหลกศีรษะที่มี EVD ตามคำสั่งการรักษา · ข้อมูลจำลองทั้งหมด")
          ),
          h("section", { className: "case-box" },
            h("div", { className: "case-head" },
              h("span", { className: "eyebrow-s" }, "กรณีศึกษาที่กำลังเล่น"),
              h("div", { className: "choice-row", role: "radiogroup", "aria-label": "เลือกกรณีศึกษา" },
                CASES.map(x => h("button", { key: x.id, role: "radio", "aria-checked": c.id === x.id, className: `chip ${c.id === x.id ? "on" : ""}`, onClick: () => setCase(x.id) }, x.label)),
                h("button", { className: "chip", onClick: randomCase }, "สุ่มกรณีใหม่")
              )
            ),
            h("div", { className: "case-body" }, h("b", null, c.label, ": ", c.caseInfo.patient), " · ", c.caseInfo.situation, h("div", { className: "muted small" }, "คำสั่ง: ", c.order.drainLevelText.replace("ตั้งระดับระบาย ", ""), " · ", c.order.position))
          ),
          h("section", { className: "grid" }, MISSIONS_META.map(m => {
            const item = prog.missions[m.id], locked = m.id === "icp" && !unlocked;
            return h("button", { key: m.id, className: `mcard ${locked ? "locked" : ""}`, onClick: () => !locked && go(m.id), disabled: locked },
              h("span", { className: "mcard-title" }, m.title),
              h("span", { className: "muted" }, m.skill),
              locked ? h("span", { className: "lock" }, "ปลดล็อกเมื่อผ่านภารกิจ 1–4") : h(Stars, { n: item?.stars ?? 0, size: 18 })
            );
          })),
          h("section", { className: "settings row center" },
            h("label", { className: "switch" }, h("input", { type: "checkbox", checked: prog.settings.learningMode, onChange: e => setLearning(e.target.checked) }), " โหมดเรียนรู้ (เส้นช่วย + snap)"),
            h("button", { className: "btn ghost", onClick: () => go("summary") }, "หน้าสรุป"),
            h("button", { className: "btn ghost", onClick: () => go("teacher") }, "ผู้สอน: ตรวจผลนิสิต"),
            confirmClr
              ? h("span", { className: "row" }, h("span", { className: "muted" }, "ล้างผลการเล่น?"), h("button", { className: "btn danger", onClick: () => { onClear(); setConfirmClr(false); } }, "ยืนยันล้าง"), h("button", { className: "btn ghost", onClick: () => setConfirmClr(false) }, "ยกเลิก"))
              : h("button", { className: "btn ghost danger", onClick: () => setConfirmClr(true) }, "ล้างประวัติ")
          )

      }

      const MISSION_MAP = { m1: Mission1, m2: Mission2, m3: Mission3, m4: Mission4, events: EventsMission, icp: IcpMission };
      function App() {
        const [prog, setProg] = useState(() => {
          const s = loadState();
          return CASE_IDS.includes(s.currentCase) ? s : { ...s, currentCase: pickOtherCase("") };
        });
        const [route, setRoute] = useState("home"), [navKey, setNavKey] = useState(0);
        useEffect(() => saveState(prog), [prog]);
        useEffect(() => { soundOn = prog.settings.sound; musicOn = prog.settings.music; musicOn ? startMusic() : stopMusic(); }, [prog.settings.sound, prog.settings.music]);
        useEffect(() => {
          const onTap = e => {
            ensureAudio(); if (musicOn) startMusic();
            const el = e.target?.closest?.("button, select, [role=radio]");
            if (el && !el.disabled && !el.classList.contains("nbtn")) sfx("tap");
          };
          document.addEventListener("pointerdown", onTap);
          return () => document.removeEventListener("pointerdown", onTap);
        }, []);
        useEffect(() => window.scrollTo(0, 0), [route]);

        const go = r => { setRoute(r); setNavKey(k => k + 1); };
        const record = (mId, stars, mistakeTags) => setProg(p => {
          const prev = p.missions[mId], done = p.casesDone?.[mId] ?? [];
          return {
            ...p,
            casesDone: { ...p.casesDone, [mId]: p.currentCase && !done.includes(p.currentCase) ? [...done, p.currentCase] : done },
            missions: { ...p.missions, [mId]: { stars: Math.max(prev?.stars ?? 0, stars), plays: (prev?.plays ?? 0) + 1, mistakeTags, lastPlayed: new Date().toISOString() } }
          };
        });
        const onStart = () => {
          if (!prog.tutorialDone) return go("tutorial");
          const next = ["m1", "m2", "m3", "m4", "events"].find(id => !prog.missions[id]) ?? (coreDone(prog) && !prog.missions.icp ? "icp" : "summary");
          go(next);
        };
        const nextFor = id => {
          const seq = ["m1", "m2", "m3", "m4", "events"];
          if (id === "events") return coreDone(prog) ? { to: "icp", label: "ไปด่านเสริม ICP" } : { to: "summary", label: "ดูหน้าสรุป" };
          if (id === "icp") return { to: "summary", label: "ดูหน้าสรุป" };
          const idx = seq.indexOf(id);
          return { to: seq[idx + 1], label: idx + 1 === 4 ? "ไปเหตุการณ์สั้น" : "ภารกิจถัดไป" };
        };

        let view;
        if (route === "tutorial") { const doneTut = () => { setProg(p => ({ ...p, tutorialDone: true })); go("m1"); }; view = h(Tutorial, { onDone: doneTut, onSkip: doneTut }); }
        else if (route in MISSION_MAP) {
          const Comp = MISSION_MAP[route], nxt = nextFor(route);
          view = h(MissionRunner, { key: navKey, id: route, title: MISSIONS_META.find(m => m.id === route).title.split(" · ")[0], learning: prog.settings.learningMode, sound: prog.settings.sound, onRecord: record, onNext: () => go(nxt.to), nextLabel: nxt.label, onReplay: () => go(route), onHome: () => go("home") }, props => h(Comp, props));
        } else if (route === "summary") view = h(SummaryPage, { prog, go, setStudent: st => setProg(p => ({ ...p, student: st })) });
        else if (route === "teacher") view = h(TeacherPage, { go });
        else view = h(HomePage, { prog, go, onStart, onClear: () => setProg({ ...defaultState(), settings: prog.settings, currentCase: pickOtherCase("") }), setLearning: v => setProg(p => ({ ...p, settings: { ...p.settings, learningMode: v } })), setCase: cid => setProg(p => ({ ...p, currentCase: cid })), randomCase: () => setProg(p => ({ ...p, currentCase: pickOtherCase(p.currentCase) })) });

        const total = MISSIONS_META.reduce((s, m) => s + (prog.missions[m.id]?.stars ?? 0), 0);
        return h("div", { className: "app" },
          h("header", { className: "topbar" },
            h("button", { className: "brand", onClick: () => go("home"), "aria-label": "หน้าหลัก" },
              h("svg", { width: "26", height: "26", viewBox: "0 0 26 26", "aria-hidden": true }, h("rect", { width: "26", height: "26", rx: "7", fill: "#12355b" }), h("path", { d: "M5 17h16M13 6v11", stroke: "#5fd3c6", strokeWidth: "2.6", strokeLinecap: "round" }), h("circle", { cx: "13", cy: "17", r: "2.6", fill: "#2f8fd8" })),
              h("span", null, "EVD Level Up")
            ),
            h("div", { className: "top-right" },
              h("span", { className: "total" }, h(Stars, { n: 1, max: 1, size: 18 }), " ", total),
              route !== "home" && h("button", { className: "btn sm ghost snd", onClick: () => go("home") }, "หน้าหลัก"),
              h("button", { className: "btn sm ghost snd", "aria-pressed": prog.settings.sound, onClick: () => setProg(p => ({ ...p, settings: { ...p.settings, sound: !p.settings.sound } })) }, prog.settings.sound ? "เสียง: เปิด" : "เสียง: ปิด"),
              h("button", { className: "btn sm ghost snd", "aria-pressed": prog.settings.music, onClick: () => setProg(p => ({ ...p, settings: { ...p.settings, music: !p.settings.music } })) }, prog.settings.music ? "เพลง: เปิด" : "เพลง: ปิด")
            )
          ),
          h("main", null, h(CaseCtx.Provider, { value: getCase(prog.currentCase) }, view))
        );
      }

      const setH = () => document.documentElement.style.setProperty("--app-h", `${Math.round(window.innerHeight)}px`);
      setH(); window.addEventListener("resize", setH);
      createRoot(document.getElementById("root")).render(h(StrictMode, null, h(App)));
    </script>
